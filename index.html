<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Jenifah 🩷</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="stars"></div>
        <div class="hearts-container"></div>
        
        <div class="content">
            <h1 class="neon-text main-text">Happy Birthday</h1>
            <h2 class="neon-text name-text">Jenifah</h2>
            <p class="neon-text sub-text">🩷 Wishing you the most wonderful day! 🩷</p>
            
            <div class="cake">
                <div class="cake-layer">🎂</div>
                <div class="candles">
                    <span class="candle">🕯️</span>
                    <span class="candle">🕯️</span>
                    <span class="candle">🕯️</span>
                </div>
            </div>
            
            <button class="surprise-btn" onclick="triggerCelebration()">🎉 Click for Surprise! 🎉</button>
            
            <div class="message-box">
                <p>May your day be filled with</p>
                <p>💝 Love, Laughter & Joy 💝</p>
            </div>
        </div>
        
        <div class="floating-emojis">
            <span class="emoji">🎈</span>
            <span class="emoji">🎁</span>
            <span class="emoji">✨</span>
            <span class="emoji">🌟</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
